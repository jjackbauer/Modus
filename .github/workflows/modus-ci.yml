name: Modus CI

on:
  push:
    branches:
      - main
      - WIP
  pull_request:
    branches:
      - main
      - WIP
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify .NET SDK runtime compatibility
        run: dotnet --version
      - name: Restore solution
        run: dotnet restore Modus.slnx
      - name: Check harness adapter sync
        run: dotnet run --project tools/HarnessSync -- --check
      - name: Build solution (Release, no restore)
        run: dotnet build Modus.slnx --configuration Release --no-restore
      - name: Test HarnessSync.Tests (Release, TRX)
        run: dotnet test tools/HarnessSync.Tests/HarnessSync.Tests.csproj --configuration Release --logger "trx;LogFileName=HarnessSync.Tests.trx"
      - name: Test Wip.ShellHost.Tests (Release, no build, TRX)
        run: dotnet test WIP/Wip.ShellHost.Tests/Wip.ShellHost.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=Wip.ShellHost.Tests.trx"
      - name: Gate runtime governance guard (Release, no build, TRX)
        run: dotnet test WIP/Wip.Runtime.Tests/Wip.Runtime.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~RunWorkflowAsync_GivenSelectedWorkflow_ExpectedStateStopsAtCheckpointed|FullyQualifiedName~RunWorkflowAsync_GivenCheckpointedSession_ExpectedStateRemainsCheckpointed|FullyQualifiedName~ResolveApprovalStatusForTransition_GivenRunInducedStateAdvancement" --logger "trx;LogFileName=RuntimeGovernanceGuard.trx"
      - name: Gate shell run governance guard (Release, no build, TRX)
        run: dotnet test WIP/Wip.Shell.E2E.Tests/Wip.Shell.E2E.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~ShellProcess_GivenRunAfterPlan_ExpectedSessionStateAndApprovalStatusRemainPreGovernance|FullyQualifiedName~ShellProcess_GivenRunOnly_ExpectedMergeCommandStillRequiresApprovalValidationAndReviewArtifacts" --logger "trx;LogFileName=ShellGovernanceGuard.trx"
      - name: Test Modus.Core.Tests (Release, no build, TRX)
        run: dotnet test tests/Modus.Core.Tests/Modus.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=Modus.Core.Tests.trx"
      - name: Test Modus.Architecture.Tests (Release, no build, TRX)
        run: dotnet test tests/Modus.Architecture.Tests/Modus.Architecture.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=Modus.Architecture.Tests.trx"
      - name: Gate migration regression suite (Release, no build, TRX)
        run: dotnet test tests/Modus.Host.IntegrationTests/Modus.Host.IntegrationTests.csproj --configuration Release --no-build --filter "MigrationRegression=true" --logger "trx;LogFileName=MigrationRegressionSuite.trx"
      - name: Dump migration regression diagnostics
        if: failure()
        shell: bash
        run: |
          trx=$(find tests/Modus.Host.IntegrationTests -name 'MigrationRegressionSuite.trx' | head -1)
          if [ -z "$trx" ]; then
            echo "::warning title=MigrationRegression::No TRX was produced for the migration regression gate."
            exit 0
          fi
          python3 - "$trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          tree = ET.parse(sys.argv[1])
          failed = 0
          for result in tree.getroot().findall(".//t:UnitTestResult", ns):
              if result.get("outcome") != "Failed":
                  continue
              failed += 1
              name = result.get("testName", "unknown")
              message = ""
              info = result.find(".//t:Output/t:ErrorInfo/t:Message", ns)
              if info is not None and info.text:
                  message = " ".join(info.text.split())[:1500]
              line = "::error title=MigrationRegression::" + name + " :: " + message
              print(line.replace("%", "%25"))
          print("::notice title=MigrationRegression::failed tests=" + str(failed))
          PY
      - name: Gate plugin endpoint curl probe (Release, no build, TRX)
        run: dotnet test tests/Modus.Host.IntegrationTests/Modus.Host.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~PluginEndpointCurlGateTests" --logger "trx;LogFileName=PluginEndpointCurlGateTests.trx"
      # The legacy Modus integration suite is blocking again: the stale pre-G0 meta-tests were
      # reconciled with the current Tests CI / Modus CI split in Phase 4 (BLK-MODUS-LEGACY-SUITE
      # resolved). The release-relevant hard gates above still run first and fail fast.
      - name: Test Modus.Host.IntegrationTests (legacy suite)
        id: legacy_suite
        run: dotnet test tests/Modus.Host.IntegrationTests/Modus.Host.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=Modus.Host.IntegrationTests.trx"
      - name: Report legacy suite failures
        if: always()
        shell: bash
        run: |
          trx=$(find tests/Modus.Host.IntegrationTests -name 'Modus.Host.IntegrationTests.trx' | head -1)
          if [ -z "$trx" ]; then
            echo "::warning title=ModusLegacySuite::No TRX was produced for the legacy integration suite."
            exit 0
          fi
          # GitHub runs bash with -e -o pipefail: a green TRX makes grep exit 1, which must not fail
          # the reporting step. Treat "no failures" as the normal case.
          failed=$(grep -E 'outcome="Failed"' "$trx" | grep -oE 'testName="[^"]+"' | head -20 || true)
          count=$(printf '%s\n' "$failed" | grep -c 'testName=' || true)
          if [ "$count" -gt 0 ]; then
            echo "::error title=ModusLegacySuite::${count} failures in the blocking legacy suite."
            printf '%s\n' "$failed" | while IFS= read -r line; do
              echo "::error title=ModusLegacySuite::${line}"
            done
          else
            echo "::notice title=ModusLegacySuite::No failures in the blocking legacy suite."
          fi
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-${{ github.run_id }}
          path: |
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/*.log
            WIP/**/TestResults/**/*.trx
            WIP/**/TestResults/**/*.log
          if-no-files-found: warn
      - name: Publish CI success flag
        if: success()
        run: echo "ci-tests=success" > ci-tests-success.flag
      - name: Upload CI success flag
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-tests-success-${{ github.run_id }}
          path: ci-tests-success.flag
          if-no-files-found: error
