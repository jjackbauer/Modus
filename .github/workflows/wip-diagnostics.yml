name: WIP Restore Diagnostics

on:
  push:
    branches:
      - WIP
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-diagnostics:
    name: restore-diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore with diagnostics
        shell: bash
        run: |
          set +e
          dotnet restore Wip.slnx -v normal > restore.log 2>&1
          code=$?
          echo "restore_exit=$code"
          {
            echo "### WIP restore exit $code"
            echo "summary:"
            grep -iE "error|NU[0-9]+|MSB[0-9]+" restore.log | tail -120
          } >> "$GITHUB_STEP_SUMMARY"
          tail -120 restore.log
          exit $code
      - name: Publish restore log to a diagnostics branch
        if: failure()
        shell: bash
        run: |
          git config user.name "wip-ci"
          git config user.email "wip-ci@users.noreply.github.com"
          { grep -iE "error|NU[0-9]+|MSB[0-9]+|Restore|Project" restore.log || true; } | tail -300 > ci-restore.log
          git checkout -B "ci-restore-diagnostics-$GITHUB_RUN_ID"
          git add ci-restore.log
          git commit -m "ci: restore diagnostics $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/ci-restore-diagnostics-$GITHUB_RUN_ID"
