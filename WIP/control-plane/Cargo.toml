[workspace]
resolver = "2"
members = [
    "domain",
    "factory-client",
    "web",
    "web-client",
    "server",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Wip.Factory Control Plane"]

[workspace.dependencies]
control-plane-domain = { path = "domain" }
control-plane-factory-client = { path = "factory-client" }
control-plane-web = { path = "web", default-features = false }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

leptos = { version = "0.8.23", default-features = false, features = ["nonce"] }
leptos_router = { version = "0.8.17", default-features = false }
leptos_axum = { version = "0.8.10" }
wasm-bindgen = "0.2"

axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.44", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header", "limit"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
rand = "0.9"
base64 = "0.22"
percent-encoding = "2.3"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
serde_with = { version = "3", features = ["chrono"] }
http-body-util = "0.1"
mime = "0.3"

[profile.dev]
debug = 0

[profile.release]
debug = 0
lto = "thin"
